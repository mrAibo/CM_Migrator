# IBM Content Manager Log Configuration
# Required by CM Java API

# Log level: 0=OFF, 1=FATAL, 2=ERROR, 3=WARN, 4=INFO, 5=DEBUG, 6=TRACE
CMB.LOG.LEVEL=2

# Log to file
CMB.LOG.FILE.ENABLED=false
CMB.LOG.FILE.PATH=./logs/cm_api.log

# Log to console
CMB.LOG.CONSOLE.ENABLED=true

# Error logging
CMB.LOG.ERROR.ENABLED=true
CMB.LOG.ERROR.STACKTRACE=true
