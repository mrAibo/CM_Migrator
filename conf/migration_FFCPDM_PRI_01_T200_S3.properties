# =============================================================================
# IBM Content Manager Migrator V8.7 - Konfiguration
# =============================================================================
# Diese Datei steuert den Migrationsprozess zwischen zwei IBM Content Managern.
# Bitte passen Sie die Werte an Ihre Umgebung an.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Verbindungsdaten (Connection)
# -----------------------------------------------------------------------------
# Der Name des Quell-Content-Managers (Library Server Name), wie in cmbicmsrvs.ini definiert.
# Beispiel: ICMNLSDB

PROFILE=MITTEL

SOURCE_SSID=LSDB
SOURCE_USER=API_USER
# SOURCE_PASSWORD=Passw
#CONNECT_PASSWORD_CRYPT=PVFtY3djM2N6RkdV
SOURCE_PASSWORD_CRYPT=PVFtY3djM2N6RkdV

# Der Name des Ziel-Content-Managers.
# Beispiel: ICMREMDB
DEST_SSID=AOKHB-ITU
DEST_USER=icmadmin
#DEST_PASSWORD=Passw
#CONNECT_PASSWORD_CRYPT=PVFtY3djM2N6RkdV
DEST_PASSWORD_CRYPT=PVFtY3djM2N6RkdV

# Benutzername für die Verbindung (wird für Quelle UND Ziel verwendet).
# Wenn leer, wird oft der System-User oder ein Default verwendet.
# Beispiel: icmadmin
# CONNECT_USER=API_USER

# Passwort für den Benutzer.
# ACHTUNG: Verwenden Sie ENTWEDER CONNECT_PASSWORD (Klartext) ODER CONNECT_PASSWORD_CRYPT (Verschlüsselt).
# Klartext-Passwort (nur für Tests empfohlen):
# CONNECT_PASSWORD=password123
# CONNECT_PASSWORD=Passw

# Verschlüsseltes Passwort (empfohlen für Produktion).
# Verschlüsselung erfolgt via Base64 -> Reverse -> Base64 (Legacy-Methode aus icmbatch).
# Beispiel: Um "password" zu verschlüsseln, nutzen Sie das Tool oder die Logik.
# CONNECT_PASSWORD_CRYPT=

# -----------------------------------------------------------------------------
# 2. Migrations-Umfang (Scope)
# -----------------------------------------------------------------------------
# Liste der zu migrierenden ItemTypes.
# Format: SourceItemType:DestItemType, SourceItemType2:DestItemType2
# Wenn Source und Dest gleich heißen, reicht der Name einmal.
# Wenn leer, versucht das Tool ALLE ItemTypes zu migrieren (Vorsicht!).
# Beispiel: Rechnungen:Rechnungen_Neu, Vertraege
#MIGRATE_ITEMTYPES=MHBPDM_DOC_05:FFEPDM_DOC_99
MIGRATE_ITEMTYPES=FFCPDM_PRI_01:FFEPDM_DOC_99

# --- Universal Mode Configuration ---

# OPERATION_MODE: Determines the action to perform.
# - MIGRATE (Default): Copies items from Source to Destination.
# - DELETE: DELETES items from Source (!)
#   WARNING: This is destructive! Use with DRY_RUN=true first.
OPERATION_MODE=MIGRATE

# FILTER_PREDICATE: SQL-like filter (XQPE) to select specific items.
# Logic: Query = /ItemType + filter
# Examples:
# - [@CREATETS < "2015-01-01"]           -> All items created before 2015.
# - [@Status = "Closed"]                     -> All items with attribute 'Status' = 'Closed'.
# - [@SemanticType = 2 AND @Size > 1000000]  -> Large documents of a specific semantic type.
# Leave empty to select ALL items of the configured ItemTypes.
# Attribute/Felder für Filter
# CREATETS
# OBJECTUPDATED
# OBJECTCREATED
# CREATEUSERID
FILTERPREDICATE=
# FILTER_PREDICATE=

# DRY_RUN: Simulation Mode.
# - true:  Logs what WOULD happen (e.g., "Would delete PID 123"), but commits nothing.
# - false: Executes operations (Migration or Deletion) for real.
# HIGHLY RECOMMENDED to set to 'true' when testing filters or deletion.
#DRY_RUN=true

# -----------------------------------------------------------------------------
# 3. Performance & Batching
# -----------------------------------------------------------------------------
# Anzahl der parallelen Worker-Threads (Consumer).
# Höhere Werte = Mehr Last auf dem Server, aber schneller.
# Empfehlung: Starten Sie mit 5-10. Bei Java 11 (Platform Threads) nicht übertreiben (max 50).
THREAD_COUNT=16

# Größe des Batches für Transaktionen.
# Anzahl der Items, die in einer Transaktion verarbeitet werden.
# Bei Fehler wird der ganze Batch zurückgerollt.
# Empfehlung: 100-500. Zu groß = lange Rollbacks. Zu klein = Overhead.
BATCH_SIZE=100
QUEUE_SIZE=10000
STREAM_UPLOAD=true
POOL_BORROW_TIMEOUT=5000
POOL_MAX_WAIT_TIME=10000

# -----------------------------------------------------------------------------
# 6. Enterprise Logging (Sparse Logging v1.28)
# -----------------------------------------------------------------------------

LOG_ITEMS_BATCHED=true        # Batch-Logging aktivieren (weniger Disk-I/O)
LOG_BATCH_INTERVAL=10000      # Jede 10.000 Items ein Progress-Eintrag
LOG_ERRORS_IMMEDIATE=true     # Fehler/Warnings sofort loggen (trotz Batch-Modus)

# -----------------------------------------------------------------------------
# 7. H2 Database Tuning (v1.27/v1.28)
# -----------------------------------------------------------------------------
# HINWEIS: Bei Profilen EXTREM/ULTI bereits vorkonfiguriert!
# Diese Parameter optimieren die Journal-Performance massiv (Diamond Grade).

DB_URL_APPEND=;CACHE_SIZE=65536;MAX_OPERATION_MEMORY=256000000;TRACE_LEVEL_FILE=0;WRITE_DELAY=6000

# Erläuterung:
# CACHE_SIZE=65536              = 64MB Cache pro Connection (schnellere Lookups)
# LOCK_MODE=0                   = Kein File-Locking (schnellste Writes, exklusiver Zugriff)
# LOG=0                         = Disable WAL/Transaction-Log (schnellste Writes)
# MAX_OPERATION_MEMORY=256000000 = 256MB Memory-Limit pro DB-Operation
# COMPRESS_LOB=0                = Keine Kompression (schneller für LOB-Metadaten)

# Absoluter Pfad zum Datenverzeichnis (für Journal-DBs)
DATA_DIR=~/bin/CM_Build_220/cm-migrator-v2.2.0/data

# -----------------------------------------------------------------------------
# 8. Journal & Audit (v1.25+)
# -----------------------------------------------------------------------------

# Lokaler Pfad für H2-Journal Datenbanken (ohne .mv.db Dateiendung)
DB_PATH=./data/migration_journal

# Audit-Protokoll Generierung (HTML Berichte pro ItemType)
GENERATE_AUDIT_PROTOCOL=true
AUDIT_PROTOCOL_OUTPUT_DIR=./reports

# CASCADE_DELETE_ON_MISSING: Löscht Items im Ziel, die in der Quelle nicht mehr existieren.
# ACHTUNG: Destruktive Operation (DANGER)!
CASCADE_DELETE_ON_MISSING=false

# -----------------------------------------------------------------------------
# 9. Auto-Remigration (v2.1.31 NEU!)
# -----------------------------------------------------------------------------
# Wenn aktiviert, markiert der Verifier bei MISMATCH automatisch Items zur Re-Migration.
# Das vereinfacht den Workflow: Nach verify.sh kann direkt start.sh aufgerufen werden.
# Die fehlgeschlagenen Items werden automatisch erneut migriert.
#
# Workflow (vereinfacht):
#   1. ./bin/start.sh      (Migration)
#   2. ./bin/verify.sh     (Verifikation + automatische Markierung bei Fehlern)
#   3. ./bin/start.sh      (Re-Migration der fehlgeschlagenen Items)
#
# Deaktivieren Sie dies nur, wenn Sie das alte remigrate.sh manuell nutzen möchten.
AUTO_MARK_FOR_REMIGRATION=true

# -----------------------------------------------------------------------------
# 10. JVM-TUNING FÜR 500M+ DOKUMENTE (v1.28)
# -----------------------------------------------------------------------------
# HINWEIS: Diese Werte dienen als Vorgabe für die Variable JVM_OPTS in start.sh.

# Speicher-Allokation (Beispiel für Server mit 64GB+ RAM)
JVM_OPTS=-Xmx32g -XX:MaxHeapFreeRatio=75 -XX:+UseG1GC -XX:+UseStringDeduplication -XX:+OptimizeStringConcat

# Erläuterung:
# -Xmx32g                     = 32GB Maximaler Heap-Speicher
# -XX:MaxHeapFreeRatio=75      = Garbage Collection Triggern bei 75% freiem Speicher
# -XX:+UseG1GC                 = G1 Garbage Collector (modern, parallel)
# -XX:+UseStringDeduplication   = Optimiert String-Pool (spart massiv RAM bei Metadaten)
# -XX:+OptimizeStringConcat     = Beschleunigt String-Verarbeitung
# -XX:ParallelGCThreads=8       = 8 GC-Threads (Einstellung je nach CPU-Kernen)
# -XX:+DisableExplicitGC        = Verhindert manuelle System.gc() Aufrufe (Performance-Killer)

# Logging
# LOG_FILE=migration.log
# LOG_LEVEL=INFO

# SOURCE_POOL_SIZE=33
# DEST_POOL_SIZE=32
# CONSUMER_DOUBLECHECK=false
# 
# CONTENT_TRANSFER_MODE=AUTO
# VALIDATION_MODE=NONE
# WebGUI Authentifizierung (v2.3)
webgui.auth.enabled=true
webgui.admin.user=admin
webgui.admin.password=admin


# Standard aktiviert (default: true)
GENERATE_AUDIT_PROTOCOL=true

# Optionale Anpassungen:
PROTOCOL_COMPANY_NAME=AOK ARGE
PROTOCOL_COMPANY_LOGO=reports/templates/images/aok_logo.png
PROTOCOL_OUTPUT_DIR=reports/

EMAIL_TO=Sven.Lindt@nds.aok.de,aleksej.voronin@nds.aok.de
# =============================================================================
# Ende der Konfiguration
# =============================================================================
