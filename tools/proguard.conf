#===============================================================================
# ProGuard Configuration for CM Migrator v2.2 (improved)
# Ziel: Obfuskierung + sinnvolle Stacktraces (Mapping), ohne unnötige Keep-Last.
#===============================================================================

# ---------------------------------------------------------------------------
# Basis
# ---------------------------------------------------------------------------
-verbose
-optimizationpasses 3
-allowaccessmodification
-dontusemixedcaseclassnames

# (Optional) Wenn du weniger Output willst:
# -dontnote **

# ---------------------------------------------------------------------------
# Warnings (sparsam halten - zu breit maskiert echte Probleme)
# ---------------------------------------------------------------------------
-dontwarn sun.**
-dontwarn com.sun.**

# ---------------------------------------------------------------------------
# Entry Points (Main-Klassen)
# ---------------------------------------------------------------------------
-keep public class com.ibm.ecm.migration.Main {
    public static void main(java.lang.String[]);
}

-keep public class com.ibm.ecm.migration.WebServer {
    public static void main(java.lang.String[]);
    public void start();
    public void stop();
}

-keep public class com.ibm.ecm.migration.Verifier {
    public static void main(java.lang.String[]);
}

# ---------------------------------------------------------------------------
# Konfiguration / Reflection-relevante DTOs
# Wichtig: Wenn Felder/Methoden per Name reflektiert werden, dürfen deren Namen
# nicht umbenannt werden -> keepclassmembersnames.
# includedescriptorclasses verhindert "unkept descriptor classes" Notes. [web:59]
# ---------------------------------------------------------------------------
-keep,includedescriptorclasses class com.ibm.ecm.migration.MigrationConfig { *; }
-keep,includedescriptorclasses class com.ibm.ecm.migration.MigrationStats  { *; }

# Alternativ (strenger, wenn wirklich nur Membernamen wichtig sind):
# -keepclassmembersnames,includedescriptorclasses class com.ibm.ecm.migration.MigrationConfig { <fields>; <methods>; }
# -keepclassmembersnames,includedescriptorclasses class com.ibm.ecm.migration.MigrationStats  { <fields>; <methods>; }

# ---------------------------------------------------------------------------
# Fix für deine konkreten "descriptor class" Notes aus dem Log
# (CMConnection$Role tauchte bei dir explizit auf)
# ---------------------------------------------------------------------------
-keep class com.ibm.ecm.migration.CMConnection$Role { *; }

# Wenn CMConnectionPool Signaturen MigrationConfig verwenden (Note im Log):
-keep class com.ibm.ecm.migration.MigrationConfig { *; }

# ---------------------------------------------------------------------------
# Native methods: Namen müssen erhalten bleiben; includedescriptorclasses empfohlen. [web:59]
# ---------------------------------------------------------------------------
-keepclasseswithmembernames,includedescriptorclasses class * {
    native <methods>;
}

# ---------------------------------------------------------------------------
# Annotations / Generics / Inner classes
# (ProGuard-Manual: SourceFile+LineNumberTable für brauchbare obfus. Stacktraces,
#   SourceFile-Name wird dabei auf eine konstante Zeichenkette gesetzt.) [web:59][web:17]
# ---------------------------------------------------------------------------
-keepattributes *Annotation*
-keepattributes Signature
-keepattributes Exceptions
-keepattributes InnerClasses
-keepattributes EnclosingMethod

-renamesourcefileattribute SourceFile
-keepattributes SourceFile,LineNumberTable

# ---------------------------------------------------------------------------
# Obfuskierungs-Stil
# Achtung: repackage/flatten kann Code brechen, wenn irgendwo Class.forName(...)
# mit festen Paketnamen läuft.
# ---------------------------------------------------------------------------
-repackageclasses 'a'
-flattenpackagehierarchy

# Mapping: nicht mit ausliefern
-printmapping build/proguard-mapping.txt

# ---------------------------------------------------------------------------
# Ressourcen/Directories
# -keepdirectories hält Directory-Entries, relevant z.B. wenn Code über
# Class.getResource("")/ClassLoader Directory-Listings erwartet. [web:17]
# ---------------------------------------------------------------------------
-keepdirectories webapp/**
-keepdirectories conf/**
