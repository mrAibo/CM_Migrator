<!DOCTYPE html><html lang='de'><head><meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>🗑️ Datenlöschung - Dashboard</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');:root {    --bg: #f8fafc;    --panel: #ffffff;    --border: #e2e8f0;    --accent: #f97316;    --primary: #0f172a;    --success: #16a34a;    --error: #dc2626;    --text-main: #1e293b;    --text-dim: #64748b;}* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }body {    font-family: 'Inter', sans-serif;    background-color: var(--bg);    color: var(--text-main);    line-height: 1.5;    min-height: 100vh;    padding: 20px;}.container { max-width: 1200px; margin: 0 auto; background: var(--panel); border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); border-radius: 12px; overflow: hidden; }.hero-section { background: var(--primary); color: #fff; padding: 40px; position: relative; }.hero-section::after { content: ''; position: absolute; top: 0; right: 0; width: 300px; height: 100%; background: linear-gradient(90deg, transparent, rgba(249,115,22,0.1)); skew-x: -20deg; transform: translateX(50px); }.dashboard-header { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }.title-group h1 { font-size: 2.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: -1px; margin: 0; }.title-group .timestamp { color: var(--accent); font-size: 0.85rem; font-weight: 600; margin-top: 4px; font-family: 'JetBrains Mono', monospace; }.status-badge { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }.status-badge.success { color: #4ade80; border-color: #4ade80; }.status-badge.error { color: #f87171; border-color: #f87171; background: rgba(248,113,113,0.1); }.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-bottom: 4px solid var(--accent); }.kpi-item { background: #fff; padding: 30px; text-align: center; }.kpi-val { font-family: 'JetBrains Mono', monospace; font-size: 2.2rem; font-weight: 700; color: var(--primary); display: block; line-height: 1; }.kpi-lab { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 10px; font-weight: 600; }.content-area { padding: 40px; background: #fff; }.grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; }.type-card { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: all 0.2s; }.type-card:hover { border-color: var(--accent); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }.card-head { background: #f8fafc; padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }.type-title { font-size: 0.95rem; font-weight: 700; color: var(--primary); }.pct-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 700; color: var(--accent); }.prog-bg { height: 6px; background: #e2e8f0; width: 100%; }.prog-fill { height: 100%; background: var(--accent); transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); }.card-body { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }.data-box { }.db-val { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 700; display: block; color: var(--text-main); }.db-lab { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; }.error-box { background: #fff1f2; border-top: 1px solid #fecdd3; padding: 15px; }.err-msg { color: var(--error); font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; display: block; margin-bottom: 6px; border-left: 2px solid var(--error); padding-left: 8px; }.text-success { color: var(--success); }.text-error { color: var(--error); }.text-muted { color: var(--text-dim); }.sortable-header { cursor: pointer; user-select: none; }@media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr 1fr; } .hero-section { padding: 20px; } .title-group h1 { font-size: 1.8rem; } }</style></head><body>
<div class='container'>
<section class='hero-section'>
<header class='dashboard-header'>
<div class='title-group'>
<h1>DELETION SYSTEM</h1>
<p class='timestamp'>REPORT GENERATED: 13. Mai 2026 um 11:13 Uhr</p></div>
<div class='status-badge success'>
OPERATION SUCCESSFUL</div></header></section>
<div class='stats-grid'>
<div class='kpi-item'><span class='kpi-val'>21115</span><span class='kpi-lab'>TOTAL ITEMS</span></div>
<div class='kpi-item'><span class='kpi-val'>21115</span><span class='kpi-lab'>SUCCESSFUL</span></div>
<div class='kpi-item'><span class='kpi-val'>0</span><span class='kpi-lab'>FAILURES</span></div>
<div class='kpi-item'><span class='kpi-val'>1m 00s</span><span class='kpi-lab'>DURATION</span></div>
<div class='kpi-item'><span class='kpi-val'>347,1 /s</span><span class='kpi-lab'>THROUGHPUT</span></div>
</div>
<div class='content-area'>
<div class='grid-layout'>
<div class='type-card'>
<div class='card-head'>
<div class='type-title'>FFEPDM_DOC_99 &rarr; FFEPDM_DOC_99</div>
<div class='pct-tag'>100,0%</div></div>
<div class='prog-bg'><div class='prog-fill' style='width: 100.0%'></div></div>
<div class='card-body'>
<div class='data-box'><span class='db-val'>21115</span><span class='db-lab'>TOTAL</span></div>
<div class='data-box'><span class='db-val text-success'>21115</span><span class='db-lab'>SUCCESS</span></div>
<div class='data-box'><span class='db-val text-muted'>0</span><span class='db-lab'>SKIPPED</span></div>
<div class='data-box'><span class='db-val text-muted'>0</span><span class='db-lab'>FAILED</span></div>
</div>
</div>
</div></div></div>
<script>function initTheme() {    const savedTheme = localStorage.getItem('theme') || 'light';    document.documentElement.setAttribute('data-theme', savedTheme);    updateThemeIcon(savedTheme);}function toggleTheme() {    const currentTheme = document.documentElement.getAttribute('data-theme');    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';    document.documentElement.setAttribute('data-theme', newTheme);    localStorage.setItem('theme', newTheme);    updateThemeIcon(newTheme);}function updateThemeIcon(theme) {    const icon = document.querySelector('.theme-toggle .icon');    if(icon) icon.textContent = theme === 'dark' ? '☀️' : '🌙';}function toggleErrorSection(header) {    const content = header.nextElementSibling;    const isExpanded = content.classList.contains('expanded');    content.classList.toggle('expanded');    const icon = header.querySelector('.toggle-icon');    if(icon) icon.textContent = isExpanded ? '▼' : '▲';}function sortTable(table, column, direction) {    const tbody = table.querySelector('tbody');    const rows = Array.from(tbody.querySelectorAll('tr'));    rows.sort((a, b) => {        const aText = a.cells[column].textContent.trim();        const bText = b.cells[column].textContent.trim();        if (!isNaN(aText) && !isNaN(bText)) {            return direction === 'asc' ? parseFloat(aText) - parseFloat(bText) : parseFloat(bText) - parseFloat(aText);        }        return direction === 'asc' ? aText.localeCompare(bText) : bText.localeCompare(aText);    });    rows.forEach(row => tbody.appendChild(row));    table.querySelectorAll('th').forEach((th, index) => {        th.classList.remove('sorted-asc', 'sorted-desc');        if (index === column) th.classList.add(direction === 'asc' ? 'sorted-asc' : 'sorted-desc');    });}document.addEventListener('DOMContentLoaded', function() {    initTheme();    const toggle = document.querySelector('.theme-toggle');    if(toggle) toggle.addEventListener('click', toggleTheme);    document.querySelectorAll('.error-header').forEach(header => {        header.addEventListener('click', () => toggleErrorSection(header));    });    document.querySelectorAll('.error-table th').forEach((th, index) => {        th.classList.add('sortable-header');        th.addEventListener('click', () => {            const table = th.closest('table');            const currentSort = th.classList.contains('sorted-asc') ? 'desc' : 'asc';            sortTable(table, index, currentSort);        });    });});</script></body></html>
